name: Preview app cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

env:
  BASE_APP: sample-python

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Compute preview app name
        id: name
        run: |
          suffix="-pr-${{ github.event.pull_request.number }}"
          echo "name=$(printf '%s' "$BASE_APP" | cut -c1-$((32 - ${#suffix})))${suffix}" >> "$GITHUB_OUTPUT"

      - name: Delete preview app
        uses: digitalocean/app_action/delete@v2
        with:
          token: ${{ secrets.DO_TOKEN }}
          app_name: ${{ steps.name.outputs.name }}
          ignore_not_found: "true"

      - name: Update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes('<!-- do-preview-app -->'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id,
                body: '<!-- do-preview-app -->\n### 🧹 Preview app deleted\nThe preview app and its database were removed because this PR was closed.' });
            }
