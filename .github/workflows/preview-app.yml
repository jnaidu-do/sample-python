name: Preview app

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One run per PR at a time; a newer push cancels the older deploy.
concurrency:
  group: preview-app-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  BASE_APP: sample-python          # name of the base App Platform app
  ENABLE_FLAG: DO_PREVIEW_APPS     # app-level env var toggled from the App Platform UI

jobs:
  preview:
    # No secrets on fork PRs, and we never run untrusted code against the app's account.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Preview Apps is enabled for the base app
        id: gate
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
        run: |
          apps_json="$(curl -sf -H "Authorization: Bearer $DO_TOKEN" "https://api.digitalocean.com/v2/apps?per_page=200")"
          echo "apps visible to token: $(echo "$apps_json" | jq -r '[.apps[].spec.name] | length') -> $(echo "$apps_json" | jq -r '[.apps[].spec.name] | join(", ")')"
          flag="$(curl -sf -H "Authorization: Bearer $DO_TOKEN" "https://api.digitalocean.com/v2/apps?per_page=200" \
            | jq -r --arg n "$BASE_APP" --arg k "$ENABLE_FLAG" \
              '[.apps[] | select(.spec.name == $n) | (.spec.envs // [])[] | select(.key == $k) | .value] | first // "false"')"
          echo "$ENABLE_FLAG=$flag"
          echo "enabled=$([ "$flag" = "true" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Build preview spec
        if: steps.gate.outputs.enabled == 'true'
        id: spec
        run: |
          name="$(.github/scripts/make-preview-spec.sh .do/app.yaml "$RUNNER_TEMP/preview-app.yaml" \
            "${{ github.event.pull_request.number }}" "${{ github.event.pull_request.head.ref }}")"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/preview-app.yaml"

      - name: Deploy preview app
        if: steps.gate.outputs.enabled == 'true'
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DO_TOKEN }}
          app_spec_location: ${{ runner.temp }}/preview-app.yaml
          print_build_logs: "true"
          print_deploy_logs: "true"

      - name: Comment preview URL on the PR
        if: steps.gate.outputs.enabled == 'true' && always() && steps.spec.outcome == 'success'
        uses: actions/github-script@v7
        env:
          APP_JSON: ${{ steps.deploy.outputs.app }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          APP_NAME: ${{ steps.spec.outputs.name }}
        with:
          script: |
            const ok = process.env.DEPLOY_OUTCOME === 'success';
            let url = '';
            try { url = JSON.parse(process.env.APP_JSON).live_url || ''; } catch (e) {}
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const marker = '<!-- do-preview-app -->';
            const body = ok
              ? `${marker}\n### 🚀 Preview app ready\n| | |\n|---|---|\n| **URL** | ${url} |\n| **App** | \`${process.env.APP_NAME}\` |\n| **Commit** | \`${sha}\` |\n| **Database** | its own throwaway dev database |\n\nThis preview is deleted automatically when the PR is closed.`
              : `${marker}\n### ❌ Preview app failed to deploy\nApp \`${process.env.APP_NAME}\` · commit \`${sha}\` · [see the workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
